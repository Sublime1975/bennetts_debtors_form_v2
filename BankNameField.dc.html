<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="position:relative">
  <label style="display:block" for="{{ fieldId }}">
    <span style="font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:0.03em;color:#A8A29E">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span style="color:#E3B679"> *</span></sc-if></span>
    <span style="position:relative;margin-top:8px;display:block">
      <input id="{{ fieldId }}" type="text" autocomplete="off" placeholder="{{ placeholder }}" value="{{ value }}" onChange="{{ handleChange }}" onFocus="{{ handleFocus }}" style="{{ inputStyle }}" />
      <svg style="pointer-events:none;position:absolute;right:16px;top:50%;transform:translateY(-50%);width:14px;height:8px" viewBox="0 0 12 8" fill="none" aria-hidden="true">
        <path d="M1 1.5L6 6.5L11 1.5" stroke="#A8A29E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </span>
  </label>
  <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
    <span style="margin-top:6px;display:block;font-size:12px;color:#f87171;font-family:'Poppins',sans-serif">{{ error }}</span>
  </sc-if>
  <sc-if value="{{ showDropdown }}" hint-placeholder-val="{{ false }}">
    <ul style="position:absolute;z-index:20;margin-top:4px;width:100%;border-radius:12px;overflow:hidden;max-height:224px;overflow-y:auto;list-style:none;padding:0;background:#1C1B19;border:1px solid rgba(255,255,255,0.1);box-shadow:0 10px 30px -10px rgba(0,0,0,0.7)">
      <sc-for list="{{ matches }}" as="b" hint-placeholder-count="3">
        <li>
          <button type="button" onClick="{{ b.select }}" style="width:100%;text-align:left;padding:10px 16px;font-family:'Poppins',sans-serif;font-size:14px;background:none;border:none;cursor:pointer;color:#FAFAF8;display:flex;align-items:center;justify-content:space-between;gap:12px">
            <span>{{ b.name }}</span>
            <span style="font-family:'Poppins',sans-serif;font-size:12px;color:#A8A29E">{{ b.universalBranchCode }}</span>
          </button>
        </li>
      </sc-for>
    </ul>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bank name&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;},&quot;onSelectBank&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(code:string)=&gt;void&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Start typing bank name…&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const SA_BANKS = [
  { name: "Absa Bank", universalBranchCode: "632005" },
  { name: "African Bank", universalBranchCode: "430000" },
  { name: "Bank Zero", universalBranchCode: "888000" },
  { name: "Bidvest Bank", universalBranchCode: "462005" },
  { name: "Capitec Bank", universalBranchCode: "470010" },
  { name: "Discovery Bank", universalBranchCode: "679000" },
  { name: "First National Bank (FNB)", universalBranchCode: "250655" },
  { name: "Investec Bank", universalBranchCode: "580105" },
  { name: "Mercantile Bank", universalBranchCode: "450905" },
  { name: "Nedbank", universalBranchCode: "198765" },
  { name: "Sasfin Bank", universalBranchCode: "683000" },
  { name: "Standard Bank", universalBranchCode: "051001" },
  { name: "TymeBank", universalBranchCode: "678910" },
  { name: "Ubank", universalBranchCode: "431010" },
];

class Component extends DCLogic {
  state = { open: false };
  handleChange = (e) => {
    if (this.props.onChange) this.props.onChange(e.target.value);
    this.setState({ open: true });
  };
  handleFocus = () => { this.setState({ open: true }); };
  select(bank) {
    if (this.props.onChange) this.props.onChange(bank.name);
    if (this.props.onSelectBank) this.props.onSelectBank(bank.universalBranchCode);
    this.setState({ open: false });
  }
  renderVals() {
    const error = this.props.error;
    const value = this.props.value ?? '';
    const query = value.trim().toLowerCase();
    const filtered = query.length === 0 ? SA_BANKS : SA_BANKS.filter((b) => b.name.toLowerCase().includes(query));
    const matches = filtered.map((b) => ({ ...b, select: () => this.select(b) }));
    const inputStyle = `width:100%;font-family:'Poppins',sans-serif;font-size:14px;border-radius:12px;padding:12px 40px 12px 16px;outline:none;box-sizing:border-box;background:rgba(255,255,255,0.04);border:1px solid ${error ? '#f87171' : 'rgba(255,255,255,0.08)'};color:#FAFAF8`;
    return {
      label: this.props.label,
      required: !!this.props.required,
      value,
      placeholder: this.props.placeholder ?? '',
      fieldId: this.props.id ?? ('bank' + Math.random().toString(36).slice(2)),
      error: error ?? '',
      inputStyle,
      handleChange: this.handleChange,
      handleFocus: this.handleFocus,
      showDropdown: this.state.open && matches.length > 0,
      matches,
    };
  }
}
</script>
</body>
</html>
