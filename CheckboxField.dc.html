<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div>
  <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer" for="{{ fieldId }}">
    <span style="position:relative;flex-shrink:0;margin-top:2px">
      <input id="{{ fieldId }}" type="checkbox" checked="{{ checked }}" onChange="{{ handleChange }}" style="position:absolute;opacity:0;width:20px;height:20px;margin:0" />
      <span style="{{ boxStyle }}">
        <sc-if value="{{ checked }}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 16 16" style="width:100%;height:100%;padding:2px;box-sizing:border-box" fill="none" aria-hidden="true">
            <path d="M3 8l3.5 3.5L13 5" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </sc-if>
      </span>
    </span>
    <span style="font-family:'Poppins',sans-serif;font-size:14px;color:#FAFAF8">{{ label }}</span>
  </label>
  <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
    <span style="margin-top:6px;display:block;font-size:12px;color:#f87171;font-family:'Poppins',sans-serif">{{ error }}</span>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Label&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;checked&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:boolean)=&gt;void&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  handleChange = (e) => { if (this.props.onChange) this.props.onChange(e.target.checked); };
  renderVals() {
    const checked = !!this.props.checked;
    const boxStyle = `display:block;width:20px;height:20px;border-radius:6px;box-sizing:border-box;background:${checked ? '#C9863F' : 'rgba(255,255,255,0.04)'};border:1px solid ${checked ? '#C9863F' : 'rgba(255,255,255,0.15)'}`;
    return {
      label: this.props.label,
      checked,
      error: this.props.error ?? '',
      fieldId: this.props.id ?? ('cb' + Math.random().toString(36).slice(2)),
      boxStyle,
      handleChange: this.handleChange,
    };
  }
}
</script>
</body>
</html>
